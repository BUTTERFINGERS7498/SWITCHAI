<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Homeward</title>
  <desc id="d">Dashboards show who's stuck. Homeward gets them home. Margaret, medically fit at 10:00, home at 12:40 instead of 19:10.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a24"/>
      <stop offset="1" stop-color="#132a2a"/>
    </linearGradient>
    <linearGradient id="go" x1="0" x2="1">
      <stop offset="0" stop-color="#79b0ff"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <g fill="none" stroke="#56d364" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" transform="translate(70 62)">
    <path d="M0 34 L30 8 L60 34"/>
    <path d="M10 26 V58 H50 V26"/>
    <path d="M24 58 V42 H36 V58"/>
  </g>
  <text x="152" y="108" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" fill="#e6edf3">Homeward</text>
  <text x="72" y="160" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="26" fill="#c9d4dd">Dashboards show who's stuck. <tspan fill="#56d364" font-weight="600">Homeward gets them home.</tspan></text>
  <text x="72" y="196" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" fill="#93a1ad">AI agents and nurses in one Switch room per patient, clearing the non-clinical blockers that keep medically fit patients in hospital beds.</text>

  <!-- timeline -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="15">
    <line x1="72" y1="262" x2="1128" y2="262" stroke="#2a333c" stroke-width="6" stroke-linecap="round"/>
    <line x1="72" y1="262" x2="1128" y2="262" stroke="#ff7b72" stroke-width="2" stroke-dasharray="6 8" opacity=".7"/>
    <line x1="72" y1="262" x2="392" y2="262" stroke="url(#go)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="262" r="8" fill="#79b0ff"/>
    <circle cx="392" cy="262" r="10" fill="#56d364"/>
    <circle cx="1128" cy="262" r="8" fill="#ff7b72"/>
    <text x="72" y="296" fill="#79b0ff">10:00 fit to go</text>
    <text x="392" y="240" fill="#56d364" text-anchor="middle" font-weight="700">12:40 home with Homeward</text>
    <text x="1128" y="296" fill="#ff7b72" text-anchor="end">19:10 home today</text>
    <text x="760" y="296" fill="#93a1ad" text-anchor="middle">6.5 bed-hours freed · 0 clinical decisions by agents</text>
  </g>
</svg>
