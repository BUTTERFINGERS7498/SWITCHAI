name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup (creates .venv, installs requirements)
        run: python scripts/homeward.py setup
      - name: Tests (contract, engine, API, CLI, scenario)
        run: python scripts/homeward.py test
